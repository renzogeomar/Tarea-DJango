{% extends 'personas/base.html' %}
{% block title %}
    Nueva Persona
{% endblock %}

{% block body %}
    <h1> Borrando Persona </h1>
    <h2> {{ object.apellidos }} / {{ object.nombres }} </h2>
    <form method="post">
        {% csrf_token %}
        <p>¿Estás seguro de que quieres eliminar esta persona?</p>
        <input type="submit" value="Confirmar">
    </form>
{% endblock %}
